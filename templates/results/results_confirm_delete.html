{% extends 'base/base.html' %}
{% block title %}Delete Result{% endblock %}

{% block content %}
<div class="container">
    <h3>Delete Result</h3>
    <p>Are you sure you want to delete result for <strong>{{ result.athlete.name if result.athlete else result.coach.name }}</strong> in <strong>{{ result.category.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'results_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
