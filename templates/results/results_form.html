{% extends 'base/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container">
    <h3>{{ title }}</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'results_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
